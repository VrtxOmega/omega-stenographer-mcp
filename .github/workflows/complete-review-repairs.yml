name: Complete reviewed repair branch
on:
  push:
    branches: [fix/review-regressions-2026-09-07]
    paths: [.github/review_repairs.py, .github/workflows/complete-review-repairs.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'VrtxOmega/omega-stenographer-mcp' && github.ref == 'refs/heads/fix/review-regressions-2026-09-07'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: steno
    steps:
      - uses: actions/checkout@v4
        with:
          path: steno
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: VrtxOmega/omega-brain-mcp
          ref: 900a061e1f714a47f90d0f233bc4c71f8d707f9e
          path: brain-reviewed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python .github/review_repairs.py
      - run: python -m pytest tests/ -v
        env:
          PYTHONUTF8: '1'
      - run: python -m pip install --no-deps .
      - run: python -I -c "import omega_runtime, veritas_bridge, omega_stenographer_mcp, omega_stenographer_mcp_standalone, codex_capture"
      - run: docker build -t omega-steno-review .
      - run: docker run --rm --entrypoint python omega-steno-review -c "import omega_stenographer_mcp_standalone, omega_stenographer_mcp, omega_runtime, veritas_bridge, codex_capture"
      - name: Commit only the validated repair files to this branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'review-files.json'), 'utf8'));
            if (files.some(p => p.startsWith('.github/') || p.includes('..') || path.isAbsolute(p))) throw Error('Unexpected publication path');
            const input = {
              branch: {repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, branchName: context.ref.replace('refs/heads/', '')},
              expectedHeadOid: context.sha,
              message: {headline: 'Fix container modules, filtered events and shared source contracts'},
              fileChanges: {additions: files.map(p => ({path: p, contents: fs.readFileSync(path.join('steno', p)).toString('base64')}))}
            };
            const result = await github.graphql('mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}', {input});
            core.notice(JSON.stringify(result.createCommitOnBranch.commit));
